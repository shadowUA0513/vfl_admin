<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- VFL mark. The letters are drawn as paths rather than <text> because a
       favicon cannot load a webfont, and a text fallback would render in a
       different face on every platform. -->
  <rect width="64" height="64" fill="#050505"/>
  <g fill="#F0171D">
    <!-- V -->
    <path d="M6 20h4.5l3 14 3-14H21l-5.25 24h-4.5z"/>
    <!-- F -->
    <path d="M24.5 20h15v4.5h-10.5v4.5h9V33.5h-9V44h-4.5z"/>
    <!-- L -->
    <path d="M43 20h4.5v19.5H58V44H43z"/>
  </g>
</svg>
